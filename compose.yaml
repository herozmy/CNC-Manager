name: cnc-manager-v2
services:
  cnc-manager:
    image: ${CNC_IMAGE:-herozmy/cnc-manager:latest}
    restart: unless-stopped
    ports:
      - "${CNC_BIND_IP:-0.0.0.0}:${CNC_PORT:-8080}:8080"
    environment:
      CNC_MAX_UPLOAD_MB: ${CNC_MAX_UPLOAD_MB:-64}
      CNC_SESSION_HOURS: ${CNC_SESSION_HOURS:-168}
    volumes:
      - cnc-manager-data:/data
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  cnc-manager-data:
